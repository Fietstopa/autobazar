<a href="tel:+420123456789" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 10px; background: #f6c445; font-weight: 700; font-size: 16px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Zavolat 123 456 789</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'specs', form: false }; }
  renderVals() {
    const t = this.state.tab;
    const tabs = [['specs', 'Parametry'], ['equip', 'Výbava'], ['desc', 'Popis']].map(([id, label]) => ({
      label, on: t === id, line: t === id ? '#f6c445' : 'transparent', color: t === id ? '#121212' : '#5c5850',
      pick: () => this.setState({ tab: id })
    }));
    return {
      tabs, showSpecs: t === 'specs', showEquip: t === 'equip', showDesc: t === 'desc',
      formOpen: this.state.form, toggleForm: () => this.setState({ form: !this.state.form }),
      specs: [
        { k: 'Rok výroby', v: '2011' }, { k: 'Najeto', v: '274 500 km' },
        { k: 'Palivo', v: 'Diesel' }, { k: 'Motor', v: '2.0 TDI' },
        { k: 'Výbava', v: 'Elegance' }, { k: 'Převodovka', v: 'Manuální' },
        { k: 'Výkon', v: '125 kW' }, { k: 'Karoserie', v: 'Liftback' },
        { k: 'Barva', v: 'Stříbrná metalíza' }, { k: 'STK do', v: '05/2027' }
      ],
      equip: ['[Klimatizace]', '[Tempomat]', '[Parkovací senzory]', '[Vyhřívaná sedadla]', '[Alu kola]', '[Servisní kniha]', '[Tažné zařízení]', '[Navigace]'],
      similar: [
        { img: '/passat11.webp', t: 'Volkswagen Passat Variant', s: '2012 · 286 400 km · Diesel', p: '99 900' },
        { img: '/passat06.webp', t: 'Volkswagen Passat', s: '2007 · 238 900 km · Diesel', p: '44 900' },
        { img: '/merc.webp', t: 'Mercedes-Benz třída A', s: '2006 · 142 700 km · Benzín', p: '49 900' }
      ]
    };
  }
}
</script>
