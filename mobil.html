<!doctype html>

<div style="width: 390px; height: 1900px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #121212; background: #f6f5f1; font-size: 15px; line-height: 22px;">

<a href="tel:+420123456789" aria-label="Zavolat" style="width: 44px; height: 44px; border-radius: 999px; background: #f6c445; display: grid; place-items: center; color: #121212;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></a>
</header>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Hlavní menu" style="position: absolute; top: 64px; left: 0; right: 0; z-index: 5; background: #121212; padding: 8px 16px 24px; display: flex; flex-direction: column;">
<a href="/vypis" style="color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.12);">Nabídka vozů</a>
<a href="#" style="color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.12);">Výkup aut</a>
<a href="#" style="color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.12);">Financování</a>
<a href="#" style="color: #ffffff; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.12);">Kontakt</a>
<div style="color: #b9b4ab; font-size: 14px; margin-top: 16px;">Ukázková 123, Teplice · Po–Pá 8–18, So 9–12</div>
</nav>

<section style="background: #121212; color: #ffffff; padding: 28px 16px 100px;">
<span style="display: inline-block; background: #f6c445; color: #121212; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 14px; line-height: 20px; padding: 5px 12px; transform: rotate(-2deg);">Autobazar Teplice</span>
<h1 style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 38px; line-height: 42px; letter-spacing: -1px; margin: 18px 0 10px;">Levných aut má <span style="display: inline-block; background: #f6c445; color: #121212; padding: 0 6px; transform: rotate(-1.5deg);">nejvíce.</span></h1>
<p style="margin: 0; color: #b9b4ab;">Ověřená ojetá auta za férové ceny.</p>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #b9b4ab;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4cc27f;"></span><span><strong style="color: #ffffff;">Otevřeno</strong> dnes 8:00–18:00</span></div>
</section>

<form role="search" style="margin: -76px 16px 0; background: #ffffff; border-radius: 16px; box-shadow: 0 12px 40px rgba(18,18,18,.16); padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Značka a model<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 12px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Všechny značky</option></select></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Cena do<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 12px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Libovolná</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Rok od<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 12px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Libovolný</option></select></label>
</div>
<a href="/vypis" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 10px; background: #f6c445; font-weight: 700;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Hledat vozy</a>
</form>

<div style="display: flex; gap: 8px; overflow-x: auto; padding: 20px 16px 0;">
<a href="/vypis" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #fff4d6; border: 1px solid #e8b12a; font-size: 14px; font-weight: 600;">Do 30 000 Kč</a>
<a href="/vypis" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Do 50 000 Kč</a>
<a href="/vypis" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Automat</a>
<a href="/vypis" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Diesel</a>
<a href="/vypis" style="flex: none; height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Kombi</a>
</div>

<section style="padding: 32px 16px 0;">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;"><h2 style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; line-height: 28px; margin: 0;">Nejnovější vozy</h2><a href="/vypis" style="font-weight: 700; font-size: 14px; box-shadow: inset 0 -2px 0 #f6c445;">Vše</a></div>
<div style="display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{cars}}" as="car" hint-placeholder-count="3">
<a href="/detail" style="background: #ffffff; border: 1px solid #e4e0d8; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
<span style="position: relative; display: block;"><img src="{{car.img}}" alt="{{car.t}}" style="width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;"><sc-if value="{{car.badge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: 12px; top: 12px; height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: {{car.badgeBg}}; color: {{car.badgeFg}};">{{car.badge}}</span></sc-if></span>
<span style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-weight: 700; font-size: 17px;">{{car.t}}</span>
<span style="font-size: 14px; color: #5c5850;">{{car.y}} · {{car.km}} km · {{car.f}}</span>
<span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px;">{{car.p}} Kč</span>
</span>
</a>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e4e0d8; padding: 12px 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<a href="tel:+420123456789" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; border: 2px solid #8a8478; font-weight: 700;">Zavolat</a>
<a href="/vypis" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #f6c445; font-weight: 700;">Nabídka vozů</a>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false }; }
  renderVals() {
    return {
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      cars: [
        { img: '/superb.webp', t: 'Škoda Superb 2.0 TDI', y: '2011', km: '274 500', f: 'Diesel', p: '119 900', badge: 'Prověřeno Cebia', badgeBg: '#ffffff', badgeFg: '#1e7a44' },
        { img: '/ibiza.webp', t: 'Seat Ibiza 1.4 16V', y: '2008', km: '152 300', f: 'Benzín', p: '34 900', badge: 'Nově', badgeBg: '#f6c445', badgeFg: '#121212' },
        { img: '/corsa.webp', t: 'Opel Corsa 1.2 16V', y: '2003', km: '168 400', f: 'Benzín', p: '24 900', badge: '', badgeBg: '', badgeFg: '' }
      ]
    };
  }
}
</script>
