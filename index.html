<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Auto Bazar — homepage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Auto Bazar Teplice — levná ověřená ojetá auta. Ukázkový návrh webu.">
<link rel="icon" href="/favicon.svg">
<script src="/morphdom.min.js"></script>
<script src="/dc-runtime.js"></script>
</head>
<body>
<template id="dc-tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f5f1}
a{color:#121212;text-decoration:none}a:hover{color:#121212}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #121212; background: #f6f5f1; font-size: 15px; line-height: 22px;">

<div style="background: #121212; color: #b9b4ab; font-size: 13px; line-height: 18px;">
<div style="max-width: 1216px; margin: 0 auto; padding: 11px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;">
<span style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4cc27f; box-shadow: 0 0 0 3px rgba(76,194,127,.25);"></span><strong style="color: #ffffff; font-weight: 600;">Otevřeno</strong> dnes 8:00–18:00</span>
<span>Ukázková 123, 415 01 Teplice</span>
<span style="flex-grow: 1;"></span>
<a href="tel:+420123456789" style="color: #ffffff; font-weight: 600;">+420 123 456 789</a>
<a href="tel:+420987654321" style="color: #ffffff; font-weight: 600;">+420 987 654 321</a>
</div>
</div>

<header style="background: #ffffff; border-bottom: 1px solid #e4e0d8;">
<div style="max-width: 1216px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px;">
<a href="/" aria-label="Auto Bazar — úvod" style="line-height: 0;"><span role="img" aria-label="Auto Bazar" style="display: inline-flex; height: 42px; border: 3px solid #f6c445; border-radius: 2px; overflow: hidden; box-sizing: border-box; font-family: Montserrat, sans-serif; font-size: 22px; line-height: 1; letter-spacing: .5px;"><span style="background: #ffffff; color: #121212; font-weight: 800; padding: 0 10px; display: flex; align-items: center;">AUTO</span><span style="background: #f6c445; color: #121212; font-weight: 400; padding: 0 10px 0 9px; display: flex; align-items: center;">BAZAR</span></span></a>
<nav aria-label="Hlavní menu" style="display: flex; flex-wrap: wrap; gap: 4px; flex-grow: 1;">
<a href="/vypis" style="font-weight: 600; padding: 10px 14px; box-shadow: inset 0 -3px 0 #f6c445;">Nabídka vozů</a>
<a href="#vykup" style="font-weight: 600; padding: 10px 14px;">Výkup aut</a>
<a href="#" style="font-weight: 600; padding: 10px 14px;">Financování</a>
<a href="#cebia" style="font-weight: 600; padding: 10px 14px;">Prověření Cebia</a>
<a href="#kontakt" style="font-weight: 600; padding: 10px 14px;">Kontakt</a>
</nav>
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" aria-label="Hledat" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #e4e0d8; background: #ffffff; display: grid; place-items: center; cursor: pointer; color: #121212;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button type="button" aria-label="Oblíbené vozy" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #e4e0d8; background: #ffffff; display: grid; place-items: center; cursor: pointer; color: #121212;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"></path></svg></button>
<a href="tel:+420123456789" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 10px; background: #f6c445; color: #121212; font-weight: 700; font-size: 14px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Zavolat</a>
</div>
</div>
</header>

<section aria-roledescription="carousel" aria-label="Hlavní nabídka" onMouseEnter="{{pause}}" onMouseLeave="{{resume}}" style="position: relative; background: #121212; color: #ffffff; height: 640px; overflow: hidden;">
<sc-for list="{{slides}}" as="s" hint-placeholder-count="1">
<div role="group" aria-roledescription="slide" aria-label="{{s.label}}" aria-hidden="{{s.hidden}}" style="position: absolute; inset: 0; opacity: {{s.opacity}}; transition: opacity .7s ease; pointer-events: {{s.pe}};">
<img src="{{s.img}}" alt="{{s.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{s.pos}}; transform: scale({{s.zoom}}); transition: transform 7s ease-out; display: block;">
<div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,.88) 0%, rgba(10,10,10,.62) 34%, rgba(10,10,10,.12) 62%, rgba(10,10,10,0) 100%);"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(0deg, rgba(10,10,10,.55), rgba(10,10,10,0));"></div>
<div style="position: relative; max-width: 1216px; margin: 0 auto; padding: 88px 32px 0; box-sizing: border-box;">
<div style="max-width: 560px;">
<span style="display: inline-block; background: #f6c445; color: #121212; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 15px; line-height: 20px; padding: 6px 14px; transform: rotate(-2deg);">{{s.tape}}</span>
<h1 style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: clamp(40px, 5vw, 62px); line-height: 1.06; letter-spacing: -1.5px; margin: 24px 0 16px; text-shadow: 0 2px 24px rgba(0,0,0,.35);"><span style="display: block;">{{s.l1}}</span>{{s.l2}} <span style="display: inline-block; background: #f6c445; color: #121212; padding: 0 8px; transform: rotate(-1.5deg); text-shadow: none;">{{s.mark}}</span></h1>
<p style="font-size: 18px; line-height: 28px; color: #e2ded6; margin: 0 0 32px; max-width: 470px;">{{s.text}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px;">
<a href="{{s.ctaHref}}" style="display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 30px; border-radius: 10px; background: #f6c445; color: #121212; font-weight: 700; font-size: 16px;">{{s.cta}} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="{{s.cta2Href}}" style="display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 26px; border-radius: 10px; border: 2px solid rgba(255,255,255,.5); background: rgba(18,18,18,.25); color: #ffffff; font-weight: 700; font-size: 16px;">{{s.cta2}}</a>
</div>
</div>
</div>
</div>
</sc-for>
<div style="position: absolute; left: 0; right: 0; bottom: 124px;">
<div style="max-width: 1216px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
<div style="display: flex; align-items: center; gap: 8px;">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.go}}" aria-label="{{d.label}}" aria-current="{{d.current}}" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center;"><span style="display: block; width: 36px; height: 4px; border-radius: 2px; background: {{d.bg}};"></span></button>
</sc-for>
<span style="font-size: 13px; font-weight: 600; color: #e2ded6; margin-left: 6px;">{{slideNo}} / 3</span>
</div>
<div style="display: flex; gap: 8px;">
<button type="button" onClick="{{prev}}" aria-label="Předchozí" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: rgba(18,18,18,.45); color: #ffffff; display: grid; place-items: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{next}}" aria-label="Další" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #f6c445; color: #121212; display: grid; place-items: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</section>

<div style="max-width: 1216px; margin: -96px auto 0; padding: 0 32px; position: relative;">
<form role="search" style="background: #ffffff; border-radius: 16px; box-shadow: 0 12px 40px rgba(18,18,18,.16); padding: 24px; color: #121212;">
<div role="tablist" style="display: flex; gap: 24px; border-bottom: 1px solid #e4e0d8; margin-bottom: 24px;">
<button type="button" role="tab" aria-selected="{{buyTab}}" onClick="{{showBuy}}" style="background: none; border: 0; border-bottom: 3px solid {{buyLine}}; padding: 0 0 12px; margin-bottom: -1px; font: 700 15px/20px Inter, sans-serif; color: {{buyColor}}; cursor: pointer;">Koupit auto</button>
<button type="button" role="tab" aria-selected="{{sellTab}}" onClick="{{showSell}}" style="background: none; border: 0; border-bottom: 3px solid {{sellLine}}; padding: 0 0 12px; margin-bottom: -1px; font: 700 15px/20px Inter, sans-serif; color: {{sellColor}}; cursor: pointer;">Prodat auto</button>
</div>
<sc-if value="{{buyTab}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
<label style="flex: 1.4 1 220px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Značka a model
<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Všechny značky</option><option>Škoda</option><option>Volkswagen</option><option>Opel</option><option>Seat</option></select></label>
<label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Cena do
<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Libovolná</option><option>30 000 Kč</option><option>50 000 Kč</option><option>100 000 Kč</option></select></label>
<label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Rok od
<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Libovolný</option><option>2005</option><option>2010</option><option>2015</option></select></label>
<label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Palivo
<select style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; background: #ffffff; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"><option>Všechna</option><option>Benzín</option><option>Diesel</option><option>LPG</option></select></label>
<a href="/vypis" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 10px; background: #f6c445; color: #121212; font-weight: 700;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Hledat vozy</a>
</div>
</sc-if>
<sc-if value="{{sellTab}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
<label style="flex: 1.4 1 220px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Značka a model
<input placeholder="např. Škoda Octavia" style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"></label>
<label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Rok výroby
<input placeholder="2012" style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"></label>
<label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5c5850;">Telefon
<input type="tel" placeholder="+420" style="height: 48px; border-radius: 10px; border: 1px solid #8a8478; padding: 0 14px; font: 500 15px Inter, sans-serif; color: #121212;"></label>
<a href="#vykup" style="flex: 0 0 auto; display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 10px; background: #121212; color: #ffffff; font-weight: 700;">Chci nabídku výkupu</a>
</div>
</sc-if>
</form>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; padding-top: 32px;">
<div style="display: flex; gap: 12px; align-items: flex-start;"><span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #fff4d6; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg></span><div><div style="font-weight: 700;">Prověřeno Cebia</div><div style="font-size: 14px; line-height: 20px; color: #5c5850;">Historii vozu si ověříte ještě před koupí.</div></div></div>
<div style="display: flex; gap: 12px; align-items: flex-start;"><span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #fff4d6; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"></path><circle cx="7" cy="7" r="1.5"></circle></svg></span><div><div style="font-weight: 700;">Levná auta</div><div style="font-size: 14px; line-height: 20px; color: #5c5850;">Největší výběr levných aut v Teplicích.</div></div></div>
<div style="display: flex; gap: 12px; align-items: flex-start;"><span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #fff4d6; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg></span><div><div style="font-weight: 700;">Výkup i protiúčet</div><div style="font-size: 14px; line-height: 20px; color: #5c5850;">Vaše staré auto vykoupíme nebo započteme.</div></div></div>
<div style="display: flex; gap: 12px; align-items: flex-start;"><span style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #fff4d6; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><div><div style="font-weight: 700;">Otevřeno Po–So</div><div style="font-size: 14px; line-height: 20px; color: #5c5850;">Přijeďte bez objednání na prohlídku.</div></div></div>
</div>
</div>

<section style="max-width: 1216px; margin: 0 auto; padding: 80px 32px 0;">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px;">
<div><h2 style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 28px; line-height: 34px; letter-spacing: -.4px; margin: 0;">Vyberte si auto u nás</h2><p style="margin: 6px 0 0; color: #5c5850;">Podle ceny, karoserie nebo převodovky — rovnou s vyfiltrovanou nabídkou.</p></div>
<a href="/vypis" style="font-weight: 700; box-shadow: inset 0 -2px 0 #f6c445; padding-bottom: 2px;">Všechny vozy →</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
<sc-for list="{{tiles}}" as="c" hint-placeholder-count="10">
<a href="/vypis" style="background: #ffffff; border: 1px solid #e4e0d8; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(18,18,18,.06), 0 4px 16px rgba(18,18,18,.06);">
<span style="position: relative; display: block; aspect-ratio: 3 / 2; background: {{c.bg}}; padding: 12px 10px 0; box-sizing: border-box;">
<img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: contain; display: block;">
<sc-if value="{{c.price}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 12px; top: 12px; background: #f6c445; color: #121212; border-radius: 10px; padding: 6px 12px 7px; transform: rotate(-4deg); box-shadow: 0 6px 16px rgba(18,18,18,.25); text-align: center;"><span style="display: block; font-size: 11px; line-height: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;">do</span><span style="display: block; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 22px; line-height: 24px;">{{c.price}}</span><span style="display: block; font-size: 11px; line-height: 14px; font-weight: 700;">tis. Kč</span></span></sc-if>
</span>
<span style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span><span style="display: block; font-weight: 700; font-size: 16px; line-height: 22px;">{{c.name}}</span><span style="display: block; font-size: 13px; line-height: 18px; color: #5c5850;"><strong style="color: #121212;">{{c.count}}</strong> vozů</span></span>
<span style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: #fff4d6; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</span>
</a>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px;">
<span style="font-size: 13px; font-weight: 600; color: #5c5850; margin-right: 4px;">Další:</span>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Diesel</a>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Benzín</a>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">LPG</a>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Tažné zařízení</a>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">S odpočtem DPH</a>
<a href="/vypis" style="height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e4e0d8; font-size: 14px; font-weight: 600;">Prověřeno Cebia</a>
</div>
</section>

<section style="max-width: 1216px; margin: 0 auto; padding: 80px 32px 0;">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px;">
<div><h2 style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 28px; line-height: 34px; letter-spacing: -.4px; margin: 0;">Nejnovější vozy</h2><p style="margin: 6px 0 0; color: #5c5850;">Čerstvě naskladněno na ploše v Teplicích.</p></div>
<a href="/vypis" style="font-weight: 700; box-shadow: inset 0 -2px 0 #f6c445; padding-bottom: 2px;">Celá nabídka vozů →</a>
</div>
